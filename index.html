<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ЭХО">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ЭХО — мессенджер СЛОВОПАДА</title>
<style>
:root{--bg:#07061a;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--tx:#e9ecff;--mut:#9aa3d6;--ac:#5ef2ff;--ac2:#b06bff;--pk:#ff4fa3;--ok:#6dffa8;--r:20px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.hid{display:none!important}
/* фон */
body::before{content:"";position:fixed;inset:-20%;background:radial-gradient(40% 35% at 20% 10%,rgba(94,242,255,.22),transparent 60%),radial-gradient(40% 35% at 85% 20%,rgba(176,107,255,.25),transparent 60%),radial-gradient(45% 40% at 60% 95%,rgba(255,79,163,.18),transparent 60%);filter:blur(30px);animation:drift 18s ease-in-out infinite alternate;z-index:-1}
@keyframes drift{to{transform:translate(3%,-2%) scale(1.05)}}
/* заставка */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:50;transition:opacity .5s,visibility .5s}
#splash.done{opacity:0;visibility:hidden}
.logo{width:112px;height:112px;border-radius:32px;display:grid;place-items:center;background:linear-gradient(140deg,var(--ac),var(--ac2) 55%,var(--pk));box-shadow:0 0 60px rgba(94,242,255,.35);animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.logo svg{width:58px;height:58px;stroke:#07061a;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:26px;font-weight:900;letter-spacing:.42em;padding-left:.42em;animation:up .8s .2s both}
.sub{color:var(--mut);font-size:13px;letter-spacing:.2em;animation:up .8s .35s both}
.bar{width:140px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;animation:up .6s .4s both}
.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--ac),var(--pk));animation:load 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
/* каркас */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sat)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
header h1{margin:0;font-size:20px;letter-spacing:.28em;flex:1;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.ibtn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
nav{display:flex;gap:6px;margin:0 14px calc(var(--sab) + 12px);padding:6px;border-radius:24px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px)}
nav button{flex:1;border:0;background:none;padding:10px 4px;border-radius:18px;cursor:pointer;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;letter-spacing:.06em;transition:.2s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx);background:linear-gradient(135deg,rgba(94,242,255,.2),rgba(255,79,163,.18));box-shadow:inset 0 0 0 1px rgba(94,242,255,.35)}
/* реклама игры */
.promo{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);text-decoration:none;color:#fff;background:linear-gradient(120deg,#3b1bff,#b06bff 50%,#ff4fa3);box-shadow:0 14px 40px rgba(176,107,255,.35);margin:6px 0 16px}
.promo::after{content:"";position:absolute;width:160px;height:160px;right:-40px;top:-60px;border-radius:50%;background:rgba(255,255,255,.18);filter:blur(4px)}
.promo b{display:block;font-size:17px;letter-spacing:.08em}
.promo span{font-size:13px;opacity:.9}
.promo .go{margin-left:auto;flex:none;padding:10px 14px;border-radius:14px;background:#fff;color:#2a1260;font-weight:800;font-size:13px;letter-spacing:.06em;z-index:1}
.promo .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:26px;z-index:1}
.sec{font-size:11px;letter-spacing:.22em;color:var(--mut);margin:18px 4px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:transform .15s}
.row:active{transform:scale(.98)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;position:relative;background:linear-gradient(135deg,var(--ac2),var(--pk))}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.rm .av{border-radius:14px;background:linear-gradient(135deg,#2c5bff,var(--ac))}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.grow small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:2px}
.badge{flex:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--pk);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.btn{border:0;border-radius:16px;padding:14px 18px;cursor:pointer;font-weight:800;letter-spacing:.08em;background:linear-gradient(120deg,var(--ac),var(--ac2));color:#07061a;width:100%}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn:disabled{opacity:.5}
.in{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);outline:none;margin-bottom:10px}
.in:focus{border-color:var(--ac)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin:10px 0;min-height:18px}
.hint.bad{color:var(--pk)}
.empty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px;line-height:1.5}
/* вход */
#auth{display:flex;flex-direction:column;justify-content:center;min-height:100%;max-width:380px;margin:0 auto;padding:20px 4px}
#auth h2{font-size:24px;margin:0 0 6px;letter-spacing:.06em}
#auth p{color:var(--mut);margin:0 0 22px;font-size:14px;line-height:1.5}
.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--card);padding:5px;border-radius:16px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:700}
.seg button.on{background:var(--tx);color:var(--bg)}
/* чат */
#chat{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:20;padding-top:var(--sat);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#chat.open{transform:none}
#chat header{border-bottom:1px solid var(--line);padding-bottom:12px}
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-break:break-word;font-size:15px;line-height:1.35}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(94,242,255,.28),rgba(176,107,255,.3));border-color:transparent}
.msg .who{display:block;font-size:12px;color:var(--ac);font-weight:700;margin-bottom:2px}
.msg .t{display:block;font-size:11px;color:var(--mut);margin-top:3px;text-align:right}
.composer{display:flex;gap:8px;padding:10px 12px calc(var(--sab) + 10px);border-top:1px solid var(--line);background:var(--bg)}
.composer input{flex:1;padding:13px 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);outline:none}
.composer button{flex:none;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--pk));display:grid;place-items:center}
.composer button svg{width:20px;height:20px;stroke:#07061a;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.qrbox{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.qrbox canvas{width:240px;height:240px;max-width:100%;border-radius:16px;background:#fff;padding:10px;box-sizing:content-box}
.qrbox .qrh{margin:0 0 4px;color:var(--mut);font-size:13px;text-align:center;line-height:1.45}
.qrc{font-size:20px;font-weight:800;letter-spacing:.2em}
.qrbox .btn{width:100%}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;transition:.25s;pointer-events:none;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 12c0-4 3-7 8-7s8 3 8 7-3 7-8 7c-1 0-2-.1-3-.4L4 20l1-3.6C4.4 15.2 4 13.7 4 12z"/><path d="M9 11h6M9 14h4"/></svg></div>
  <div class="brand">ЭХО</div>
  <div class="sub">мессенджер СЛОВОПАДА</div>
  <div class="bar"><i></i></div>
</div>

<!-- вход -->
<div id="app" class="hid">
  <main id="authWrap" class="hid" style="display:flex;flex-direction:column">
    <div id="auth">
      <h2>Вход в ЭХО</h2>
      <p>Используй тот же ник и пароль, что в игре СЛОВОПАД. Друзья, комнаты и сообщения будут общими.</p>
      <div class="seg"><button id="tLogin" class="on" type="button">Войти</button><button id="tReg" type="button">Создать</button></div>
      <input class="in" id="nick" placeholder="Ник (3–20 символов)" autocomplete="username" maxlength="20">
      <input class="in" id="pass" type="password" placeholder="Пароль (от 8 символов)" autocomplete="current-password">
      <button class="btn" id="go" type="button">ВОЙТИ</button>
      <div class="hint" id="authHint"></div>
      <button class="btn ghost" id="qrOpen" type="button">📷 ВОЙТИ ПО QR ИЗ ИГРЫ</button>
      <div id="qrBox" class="qrbox hid">
        <p class="qrh">Открой игру на телефоне, где ты уже вошёл: Профиль → Slovopad ID → «Сканировать QR». Или наведи камеру телефона на код.</p>
        <canvas id="qrCv" width="240" height="240"></canvas>
        <div class="qrc" id="qrCode"></div>
        <div class="hint" id="qrPin"></div>
        <div class="hint" id="qrHint"></div>
        <button class="btn ghost hid" id="qrNew" type="button">НОВЫЙ КОД</button>
        <button class="btn ghost" id="qrCancel" type="button" style="margin-top:8px">ОТМЕНА</button>
      </div>
    </div>
  </main>

  <div id="home" class="hid" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header>
      <h1>ЭХО</h1>
      <button class="ibtn" id="refresh" type="button" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg></button>
    </header>
    <main id="content"></main>
    <nav>
      <button data-tab="chats" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M21 12c0 4-4 7-9 7-1.2 0-2.3-.2-3.3-.5L4 20l1.3-3.9C4.5 15 4 13.6 4 12c0-4 4-7 9-7s8 3 8 7z"/></svg>Чаты</button>
      <button data-tab="rooms" type="button"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>Комнаты</button>
      <button data-tab="friends" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.6 3.4 5.2"/></svg>Друзья</button>
    </nav>
  </div>
</div>

<!-- чат с человеком -->
<section id="chat" aria-label="Чат">
  <header>
    <button class="ibtn" id="chBack" type="button" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="av" id="chAv" style="width:38px;height:38px;font-size:15px"></div>
    <div class="grow"><b id="chName"></b><small id="chSub"></small></div>
  </header>
  <div id="msgs"></div>
  <div class="composer"><input id="chIn" placeholder="Сообщение" maxlength="500" enterkeyhint="send"><button id="chSend" type="button" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button></div>
</section>

<div class="toast" id="toast"></div>

<script src="qr.js"></script>
<script>
(() => {
  "use strict";
  // Тот же сервер, что у игры: аккаунт, друзья и сообщения общие.
  const API = "https://slovopad-api.stasikyarosh2000.workers.dev";
  const GAME = "https://felykxzy.github.io/slovopad.game/";
  const TOKEN = "echoToken";
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let token = null; try { token = localStorage.getItem(TOKEN) } catch (e) {}
  let me = null, tab = "chats", chat = null, room = null, timer = null, last = 0, busy = false;

  const toast = (t) => { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200) };

  async function api(path, body) {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000);
    let r;
    try {
      r = await fetch(API + path, { method: body === undefined ? "GET" : "POST", headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) }, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal });
    } catch (e) { throw new Error("Нет связи с сервером. Проверь интернет.") } finally { clearTimeout(tm) }
    let d = {}; try { d = await r.json() } catch (e) {}
    if (r.status === 401 && token) { logout(true); throw new Error("Сессия истекла. Войди снова.") }
    if (!r.ok) throw new Error(d.error || ("Ошибка сервера: " + r.status));
    return d;
  }
  const av = (p, cls = "") => `<div class="av ${p && p.online ? "on" : ""} ${cls}">${esc((p && (p.avatar || (p.username || "?")[0])) || "?")}</div>`;
  const ico = {
    add: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12l4 4 10-10"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  /* ---------- заставка и вход ---------- */
  setTimeout(boot, 1100);
  function boot() {
    $("splash").classList.add("done");
    if (token) { $("app").classList.remove("hid"); $("home").classList.remove("hid"); loadMe(); }
    else { $("app").classList.remove("hid"); $("authWrap").classList.remove("hid"); }
  }
  let mode = "login";
  const setMode = m => { mode = m; $("tLogin").classList.toggle("on", m === "login"); $("tReg").classList.toggle("on", m === "reg"); $("go").textContent = m === "login" ? "ВОЙТИ" : "СОЗДАТЬ АККАУНТ"; $("authHint").textContent = "" };
  $("tLogin").onclick = () => setMode("login"); $("tReg").onclick = () => setMode("reg");
  $("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click() });
  $("go").onclick = async () => {
    if (busy) return;
    const username = $("nick").value.trim(), password = $("pass").value;
    if (username.length < 3 || password.length < 8) { $("authHint").textContent = "Ник от 3 символов, пароль от 8."; $("authHint").classList.add("bad"); return }
    busy = true; $("go").disabled = true; $("authHint").classList.remove("bad"); $("authHint").textContent = "Подключаюсь…";
    try {
      const d = await api(mode === "login" ? "/api/login" : "/api/register", { username, password });
      token = d.token; localStorage.setItem(TOKEN, token);
      $("pass").value = ""; $("authWrap").classList.add("hid"); $("home").classList.remove("hid"); me = d; render();
    } catch (e) { $("authHint").textContent = e.message; $("authHint").classList.add("bad") }
    finally { busy = false; $("go").disabled = false }
  };
  async function loadMe() { try { me = await api("/api/me") } catch (e) { return } render() }
  function logout(silent) {
    token = null; me = null; try { localStorage.removeItem(TOKEN) } catch (e) {}
    closeChat(); stopPoll(); $("home").classList.add("hid"); $("authWrap").classList.remove("hid");
    if (!silent) toast("Ты вышел из аккаунта");
  }

  /* ---------- вход по QR из игры ---------- */
  let qr = null, qrTimer = 0;
  function qrStop() {
    clearInterval(qrTimer); qrTimer = 0; qr = null;
    $("qrBox").classList.add("hid"); $("qrOpen").classList.remove("hid");
  }
  async function qrStart() {
    qrStop();
    $("qrBox").classList.remove("hid"); $("qrOpen").classList.add("hid"); $("qrNew").classList.add("hid");
    $("qrPin").textContent = ""; $("qrCode").textContent = ""; $("qrHint").classList.remove("bad"); $("qrHint").textContent = "Создаю код…";
    let d;
    try { d = await api("/api/qr/new", {}) } catch (e) { qrStop(); $("authHint").textContent = e.message; $("authHint").classList.add("bad"); return }
    const s = qr = { code: d.code, secret: d.secret, end: Date.now() + d.expiresIn * 1000 };
    try { SlovopadQR.draw($("qrCv"), GAME + "?qr=" + d.code, 240) } catch (e) { qrStop(); $("authHint").textContent = "Не удалось нарисовать код."; return }
    $("qrCode").textContent = d.code.slice(0, 4) + "-" + d.code.slice(4);
    $("qrPin").textContent = "Число для телефона: " + d.pin;
    $("qrHint").textContent = "Жду подтверждения из игры…"; $("qrBox").scrollIntoView({ behavior: "smooth", block: "center" });
    qrTimer = setInterval(async () => {
      if (qr !== s) return;
      if (Date.now() >= s.end) {
        clearInterval(qrTimer); qr = null;
        $("qrHint").textContent = "Код устарел. Создай новый."; $("qrHint").classList.add("bad"); $("qrNew").classList.remove("hid"); return;
      }
      const left = Math.max(0, Math.ceil((s.end - Date.now()) / 1000));
      $("qrHint").textContent = "Жду подтверждения из игры… Действует ещё " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      let r; try { r = await api("/api/qr/poll", { code: s.code, secret: s.secret }) } catch (e) { return }
      if (qr !== s) return;
      if (r.status === "ok") {
        clearInterval(qrTimer); qr = null;
        token = r.token; localStorage.setItem(TOKEN, token);
        me = r; $("qrBox").classList.add("hid"); $("authWrap").classList.add("hid"); $("home").classList.remove("hid"); render(); toast("Вход выполнен");
      } else if (r.status === "expired") {
        clearInterval(qrTimer); qr = null;
        $("qrHint").textContent = "Код устарел. Создай новый."; $("qrHint").classList.add("bad"); $("qrNew").classList.remove("hid");
      }
    }, 2000);
  }
  $("qrOpen").onclick = qrStart;
  $("qrNew").onclick = qrStart;
  $("qrCancel").onclick = qrStop;

  /* ---------- главная ---------- */
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b)); render() });
  $("refresh").onclick = () => render();

  const promo = () => `<a class="promo" href="${GAME}" target="_blank" rel="noopener">
      <div class="ic">🎮</div>
      <div><b>СЛОВОПАД</b><span>Скорость печати и рекорды друзей</span></div>
      <div class="go">ИГРАТЬ</div></a>`;

  async function render() {
    if (!token) return;
    const c = $("content");
    if (tab === "chats") {
      const d = await api("/api/friends").catch(e => ({ err: e.message }));
      if (d.err) return c.innerHTML = promo() + `<div class="empty">${esc(d.err)}</div>`;
      const fr = d.friends || [];
      c.innerHTML = promo() + (fr.length ? `<div class="sec">ЛИЧНЫЕ ЧАТЫ</div>` + fr.map(p => `<div class="row" data-chat="${esc(p.spCode)}">${av(p)}<div class="grow"><b>${esc(p.username)}</b><small>${p.online ? "в сети" : "не в сети"}</small></div>${p.unread ? `<span class="badge">${p.unread}</span>` : ""}</div>`).join("")
        : `<div class="empty">Пока нет друзей. Добавь их во вкладке «Друзья», и здесь появятся чаты.</div>`);
      c.querySelectorAll("[data-chat]").forEach(el => el.onclick = () => openChat(fr.find(p => p.spCode === el.dataset.chat)));
    }
    if (tab === "rooms") {
      const d = await api("/api/echo/rooms").catch(e => ({ err: e.message }));
      if (d.err) return c.innerHTML = promo() + `<div class="empty">${esc(d.err)}</div>`;
      const rs = d.rooms || [];
      c.innerHTML = promo() + (rs.length ? `<div class="sec">КОМНАТЫ</div>` + rs.map(r => `<div class="row rm" data-room="${esc(r.id)}" data-name="${esc(r.name)}"><div class="av">${esc((r.name || "#")[0])}</div><div class="grow"><b>${esc(r.name)}</b><small>${esc(r.last || (r.members + " участн."))}</small></div>${r.unread ? `<span class="badge">${r.unread}</span>` : ""}</div>`).join("")
        : `<div class="empty">Комнат пока нет. Создай свою или попроси друга пригласить тебя.</div>`);
      c.querySelectorAll("[data-room]").forEach(el => el.onclick = () => openRoom(el.dataset.room, el.dataset.name));
    }
    if (tab === "friends") {
      const d = await api("/api/friends").catch(e => ({ err: e.message }));
      if (d.err) return c.innerHTML = `<div class="empty">${esc(d.err)}</div>`;
      c.innerHTML = `<div class="sec">ДОБАВИТЬ ДРУГА</div>
        <div style="display:flex;gap:8px;margin-bottom:6px"><input class="in" id="fq" placeholder="Ник или код SP-…" style="margin:0"><button class="btn" id="fadd" style="width:auto;padding:0 16px" type="button" aria-label="Добавить">${ico.add}</button></div>
        <div class="hint" id="fh"></div>
        ${(d.incoming || []).length ? `<div class="sec">ЗАПРОСЫ</div>` + d.incoming.map(p => `<div class="row">${av(p)}<div class="grow"><b>${esc(p.username)}</b><small>${esc(p.spCode)}</small></div><button class="ibtn" data-yes="${esc(p.spCode)}" aria-label="Принять">${ico.check}</button>&nbsp;<button class="ibtn" data-no="${esc(p.spCode)}" aria-label="Отклонить">${ico.x}</button></div>`).join("") : ""}
        <div class="sec">ДРУЗЬЯ · ${(d.friends || []).length}</div>
        ${(d.friends || []).length ? d.friends.map(p => `<div class="row">${av(p)}<div class="grow"><b>${esc(p.username)}</b><small>${esc(p.spCode)}</small></div><button class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px" data-chat="${esc(p.spCode)}">Написать</button></div>`).join("") : `<div class="empty">Друзей пока нет.</div>`}`;
      const fh = (t, bad) => { $("fh").textContent = t; $("fh").classList.toggle("bad", !!bad) };
      $("fadd").onclick = async () => {
        const q = $("fq").value.trim(); if (!q) return fh("Введи ник или код.", true);
        try { const r = await api("/api/friends/request", { q }); $("fq").value = ""; fh(r.state === "accepted" ? "Теперь вы друзья ✓" : "Запрос отправлен."); render() }
        catch (e) { fh(e.message, true) }
      };
      c.querySelectorAll("[data-yes]").forEach(b => b.onclick = async () => { await api("/api/friends/respond", { code: b.dataset.yes, accept: true }).catch(e => toast(e.message)); render() });
      c.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => { await api("/api/friends/respond", { code: b.dataset.no, accept: false }).catch(e => toast(e.message)); render() });
      c.querySelectorAll("[data-chat]").forEach(b => b.onclick = () => openChat((d.friends || []).find(p => p.spCode === b.dataset.chat)));
    }
  }

  /* ---------- личный чат ---------- */
  function openChat(p) {
    if (!p) return;
    closeChat(false); chat = p; room = null; last = 0;
    $("chName").textContent = p.username; $("chSub").textContent = p.online ? "в сети" : "не в сети";
    $("chAv").className = "av " + (p.online ? "on" : ""); $("chAv").textContent = (p.avatar || p.username[0]).toString();
    $("msgs").innerHTML = ""; $("chat").classList.add("open");
    pollChat(); timer = setInterval(pollChat, 3000);
  }
  async function pollChat() {
    if (!chat) return;
    const who = chat;
    try {
      const r = await api("/api/chat?with=" + encodeURIComponent(who.spCode) + "&after=" + last);
      if (chat !== who) return;
      const box = $("msgs"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || !last;
      (r.messages || []).forEach(m => { if (m.id <= last) return; last = m.id; box.insertAdjacentHTML("beforeend", `<div class="msg ${m.mine ? "me" : ""}">${esc(m.body)}<span class="t">${clock(m.t)}</span></div>`) });
      if (stick) box.scrollTop = box.scrollHeight;
    } catch (e) {}
  }
  async function sendChat() {
    const t = $("chIn").value.trim(); if (!t) return;
    if (room) {
      const cur = room; $("chIn").value = "";
      try { await api("/api/echo/room/send", { room: cur.id, text: t }); pollRoom() } catch (e) { toast(e.message) }
      return;
    }
    if (!chat) return;
    const who = chat; $("chIn").value = "";
    try { await api("/api/chat/send", { to: who.spCode, text: t }); pollChat() } catch (e) { toast(e.message) }
  }
  function closeChat(hide = true) {
    clearInterval(timer); timer = null;
    if (hide) $("chat").classList.remove("open");
    chat = null;
  }
  $("chBack").onclick = () => { closeChat(); render() };
  $("chSend").onclick = sendChat;
  $("chIn").addEventListener("keydown", e => { if (e.key === "Enter") sendChat() });

  /* ---------- комната ---------- */
  function openRoom(id, name) {
    closeChat(false); room = { id, name }; last = 0;
    $("chName").textContent = "# " + name; $("chSub").textContent = "комната";
    $("chAv").className = "av rm"; $("chAv").textContent = (name || "#")[0];
    $("msgs").innerHTML = ""; $("chat").classList.add("open");
    pollRoom(); timer = setInterval(pollRoom, 3000);
  }
  async function pollRoom() {
    if (!room) return;
    const cur = room;
    try {
      const r = await api("/api/echo/room/msgs?room=" + encodeURIComponent(cur.id) + "&after=" + last);
      if (room !== cur) return;
      const box = $("msgs"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || !last;
      (r.messages || []).forEach(m => { if (m.id <= last) return; last = m.id; box.insertAdjacentHTML("beforeend", `<div class="msg ${m.mine ? "me" : ""}">${m.mine ? "" : `<span class="who">${esc(m.who)}</span>`}${esc(m.body)}<span class="t">${clock(m.t)}</span></div>`) });
      if (stick) box.scrollTop = box.scrollHeight;
    } catch (e) {}
  }
  function stopPoll() { clearInterval(timer); timer = null }
  const clock = t => { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") };

  if (token) loadMe();
})();
</script>
</body>
</html>
