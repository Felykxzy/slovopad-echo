<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ЭХО">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ЭХО — мессенджер СЛОВОПАДА</title>
<style>
:root{
  --bg:#06051a;--tx:#f4f6ff;--mut:rgba(214,220,255,.66);
  --ac:#7af0ff;--ac2:#b58cff;--pk:#ff6fb5;--ok:#7dffb3;
  --glass:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  --glass-line:rgba(255,255,255,.22);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.06);
  --shadow:0 18px 50px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  --r:28px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.hid{display:none!important}
/* живой фон: цветные пятна под стеклом */
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none;opacity:.85}
body::before{width:62vmax;height:62vmax;left:-18vmax;top:-14vmax;background:radial-gradient(circle,rgba(122,240,255,.55),transparent 65%);animation:f1 22s ease-in-out infinite alternate}
body::after{width:58vmax;height:58vmax;right:-20vmax;bottom:-10vmax;background:radial-gradient(circle,rgba(181,140,255,.6),transparent 65%),radial-gradient(circle at 70% 70%,rgba(255,111,181,.45),transparent 60%);animation:f2 26s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes f2{to{transform:translate(-10vmax,-6vmax) scale(1.1)}}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--shadow)}
/* заставка */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:50;transition:opacity .6s var(--ease),visibility .6s}
#splash.done{opacity:0;visibility:hidden}
.logo{width:124px;height:124px;border-radius:38px;display:grid;place-items:center;position:relative;background:linear-gradient(140deg,rgba(122,240,255,.9),rgba(181,140,255,.9) 55%,rgba(255,111,181,.9));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 24px 80px rgba(122,240,255,.35);animation:pop 1s var(--ease) both}
.logo::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent 50%);opacity:.7}
.logo svg{width:60px;height:60px;stroke:#130d33;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.brand{font-size:28px;font-weight:800;letter-spacing:.44em;padding-left:.44em;animation:up .9s .2s var(--ease) both}
.sub{color:var(--mut);font-size:13px;letter-spacing:.16em;animation:up .9s .35s var(--ease) both}
.bar{width:150px;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;animation:up .6s .4s both}
.bar i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--pk));animation:load 1.3s ease-in-out infinite}
@keyframes pop{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}
/* каркас */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sat)}
header{display:flex;align-items:center;gap:12px;padding:14px 18px 10px}
header h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.14em;flex:1;background:linear-gradient(100deg,#fff 10%,var(--ac) 55%,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.ibtn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--glass-hi),0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow-y:auto;padding:6px 16px 130px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
/* плавающая стеклянная панель снизу */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);width:min(420px,calc(100% - 28px));display:flex;padding:6px;border-radius:32px;z-index:10}
nav::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%);pointer-events:none}
nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:26px;background:linear-gradient(135deg,rgba(122,240,255,.32),rgba(255,111,181,.28));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:transform .45s var(--ease)}
nav button{position:relative;z-index:1;flex:1;border:0;background:none;padding:10px 4px 9px;border-radius:26px;cursor:pointer;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;transition:color .3s}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff}
/* карточка рекламы игры */
.promo{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r);text-decoration:none;color:#fff;margin:4px 0 20px;background:linear-gradient(125deg,rgba(94,80,255,.85),rgba(181,140,255,.8) 50%,rgba(255,111,181,.85));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 20px 50px rgba(181,140,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.promo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.promo::after{content:"";position:absolute;width:200px;height:200px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%)}
.promo b{display:block;font-size:18px;letter-spacing:.1em;position:relative}
.promo span{font-size:13px;opacity:.92;position:relative;display:block;margin-top:2px}
.promo .ic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);position:relative;z-index:1}
.promo .go{margin-left:auto;flex:none;padding:11px 16px;border-radius:18px;background:rgba(255,255,255,.92);color:#2a1260;font-weight:800;font-size:13px;letter-spacing:.06em;position:relative;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sec{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mut);margin:22px 6px 10px}
.row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;margin-bottom:10px;cursor:pointer;transition:transform .25s var(--ease),background .25s;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%)}
.row:active{transform:scale(.975)}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;position:relative;background:linear-gradient(135deg,var(--ac2),var(--pk));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(181,140,255,.35)}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2.5px solid #0c0a24;box-shadow:0 0 10px rgba(125,255,179,.7)}
.rm .av{border-radius:18px;background:linear-gradient(135deg,#4f7bff,var(--ac))}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:650}
.grow small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:3px}
.badge{flex:none;min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:linear-gradient(135deg,var(--pk),#ff9a6b);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 4px 12px rgba(255,111,181,.45)}
.btn{position:relative;border:1px solid rgba(255,255,255,.4);border-radius:22px;padding:16px 18px;cursor:pointer;font-weight:750;letter-spacing:.06em;width:100%;color:#0b0a26;background:linear-gradient(120deg,rgba(122,240,255,.95),rgba(181,140,255,.95) 60%,rgba(255,111,181,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 14px 30px rgba(122,240,255,.25);transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);color:var(--tx);border-color:var(--glass-line);box-shadow:var(--glass-hi),0 10px 26px rgba(0,0,0,.2);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%)}
.btn:disabled{opacity:.5}
.in{width:100%;padding:16px 18px;border-radius:22px;border:1px solid var(--glass-line);background:rgba(255,255,255,.07);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);outline:none;margin-bottom:12px;color:var(--tx);transition:border-color .2s,box-shadow .2s}
.in::placeholder{color:rgba(214,220,255,.45)}
.in:focus{border-color:rgba(122,240,255,.7);box-shadow:0 0 0 4px rgba(122,240,255,.15),inset 0 1px 0 rgba(255,255,255,.2)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin:12px 0;min-height:18px;line-height:1.45}
.hint.bad{color:#ff9bc6}
.empty{text-align:center;color:var(--mut);padding:44px 18px;font-size:15px;line-height:1.55}
.empty::before{content:"✦";display:block;font-size:30px;margin-bottom:12px;background:linear-gradient(120deg,var(--ac),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
/* вход */
#auth{display:flex;flex-direction:column;justify-content:center;min-height:100%;max-width:400px;margin:0 auto;padding:24px 4px 40px}
#auth h2{font-size:30px;font-weight:800;margin:0 0 8px;letter-spacing:.04em}
#auth p{color:var(--mut);margin:0 0 24px;font-size:15px;line-height:1.5}
.seg{display:flex;gap:6px;margin-bottom:16px;padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.seg button{flex:1;border:0;background:none;padding:12px;border-radius:18px;cursor:pointer;color:var(--mut);font-weight:700;transition:all .3s var(--ease)}
.seg button.on{background:rgba(255,255,255,.92);color:#0b0a26;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.qrbox{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px;border-radius:var(--r);background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--shadow);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%)}
.qrbox canvas{width:240px;height:240px;max-width:100%;border-radius:24px;background:#fff;padding:12px;box-sizing:content-box;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.qrbox .qrh{margin:0 0 4px;color:var(--mut);font-size:13px;text-align:center;line-height:1.5}
.qrc{font-size:22px;font-weight:800;letter-spacing:.22em}
.qrbox .btn{width:100%}
/* чат */
#chat{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:20;padding-top:var(--sat);transform:translateX(100%);transition:transform .4s var(--ease)}
#chat.open{transform:none}
#chat header{margin:8px 10px 0;padding:10px 12px;border-radius:30px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%)}
#msgs{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:11px 15px 9px;border-radius:24px 24px 24px 8px;background:var(--glass);border:1px solid var(--glass-line);align-self:flex-start;word-break:break-word;font-size:16px;line-height:1.38;box-shadow:var(--glass-hi),0 8px 20px rgba(0,0,0,.18);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);animation:up .35s var(--ease) both}
.msg.me{align-self:flex-end;border-radius:24px 24px 8px 24px;background:linear-gradient(135deg,rgba(122,240,255,.45),rgba(181,140,255,.5) 60%,rgba(255,111,181,.45));border-color:rgba(255,255,255,.4)}
.msg .who{display:block;font-size:12px;color:var(--ac);font-weight:700;margin-bottom:3px}
.msg .t{display:block;font-size:11px;color:var(--mut);margin-top:4px;text-align:right}
.composer{position:relative;display:flex;gap:10px;align-items:center;margin:6px 12px calc(var(--sab) + 12px);padding:7px;border-radius:34px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),0 12px 34px rgba(0,0,0,.3);backdrop-filter:blur(28px) saturate(190%);-webkit-backdrop-filter:blur(28px) saturate(190%)}
.composer input{flex:1;min-width:0;padding:12px 16px;border:0;background:none;outline:none;font-size:16px;color:var(--tx)}
.composer input::placeholder{color:rgba(214,220,255,.5)}
.composer button{flex:none;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2) 55%,var(--pk));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 20px rgba(122,240,255,.35);display:grid;place-items:center;transition:transform .2s var(--ease)}
.composer button:active{transform:scale(.9)}
.composer button svg{width:20px;height:20px;stroke:#0b0a26;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 104px);transform:translateX(-50%) translateY(20px);opacity:0;padding:12px 18px;border-radius:20px;font-size:14px;transition:.35s var(--ease);pointer-events:none;z-index:60;max-width:90vw;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:var(--glass-hi),var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- звонки ---- */
#call{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;gap:10px;padding:calc(var(--sat) + 8px) 12px calc(var(--sab) + 12px);background:radial-gradient(120% 80% at 50% 0%,#1b1550,var(--bg) 70%);transform:translateY(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s linear .4s}
#call.open{transform:none;visibility:visible;transition:transform .4s var(--ease),visibility 0s}
#call .clh{display:flex;align-items:center;gap:12px}
#call .clt{display:flex;flex-direction:column;min-width:0}#call .clt b{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#call .clt small{color:var(--mut);font-size:13px}#call .clt i{font-style:normal;color:#9ff}
.cgrid{position:relative;flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:1fr;grid-auto-rows:1fr;width:100%;max-width:960px;margin:0 auto}
.cgrid[data-n="3"],.cgrid[data-n="4"]{grid-template-columns:1fr 1fr}
.cgrid[data-n="2"] .ctile.self{position:absolute;right:12px;bottom:12px;width:min(30%,150px);aspect-ratio:3/4;height:auto;z-index:3;border:2px solid rgba(255,255,255,.5)}
.cgrid[data-n="2"] .ctile.self .cnm{display:none}
@media (min-width:760px){.cgrid[data-n="2"]{grid-template-columns:1fr 1fr}.cgrid[data-n="2"] .ctile.self{position:relative;right:auto;bottom:auto;width:auto;aspect-ratio:auto}}
.ctile{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--glass-line);box-shadow:var(--glass-hi);min-height:0}
.ctile.wait{border-color:rgba(255,200,80,.6)}
.ctile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.ctile.self.flip video{transform:scaleX(-1)}.ctile{isolation:isolate}.ctile video{transform:translateZ(0)}.ctile.self.flip video{transform:scaleX(-1) translateZ(0)}.ctile.nocam .cav{z-index:1;background:linear-gradient(145deg,#1b1f55,#2a1250)}.ctile.scr video{object-fit:contain;background:#05060f}
.ctile .cav{position:absolute;inset:0;display:none;align-items:center;justify-content:center}.ctile.nocam .cav{display:flex}
.ctile .cav i{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:36px;font-weight:700;color:#fff}
.ctile.self .cav i{width:56px;height:56px;font-size:24px}
.ctile .cnm{position:absolute;left:12px;bottom:10px;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.45);font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ctile .cst{position:absolute;right:10px;top:10px;color:#ff8fb6}
.ctile.speak{border-color:#6dffa3;box-shadow:0 0 0 3px rgba(109,255,163,.9),0 0 30px rgba(109,255,163,.4)}
.cwait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mut)}
.cwait i{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#9ff;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.chint{min-height:18px;text-align:center;font-size:13px;color:var(--mut)}.chint.bad{color:#ff9bc6}
.cbar{display:flex;gap:14px;justify-content:center;align-self:center;padding:12px 20px 8px;border-radius:36px}
.cbw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut)}.cbw[hidden]{display:none}
.cb{width:56px;height:56px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);box-shadow:var(--glass-hi);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.cb:active{transform:scale(.92)}.cb.off{background:rgba(255,90,140,.35)}.cb.on{background:rgba(94,242,255,.35)}.cb.end{background:linear-gradient(135deg,#ff5a7a,#d6204a);border-color:rgba(255,255,255,.4)}
.clcm{position:absolute;left:50%;bottom:calc(var(--sab) + 120px);transform:translateX(-50%);width:min(88%,340px);padding:8px;border-radius:22px;background:rgba(20,18,60,.92);border:1px solid var(--glass-line);z-index:5}
.clci{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:14px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}.clci.on{background:rgba(94,242,255,.2)}
.chbtn{display:none}#chat.canc .chbtn{display:flex}
#chBanner{margin:8px 12px 0;padding:10px 14px;border-radius:20px;display:flex;align-items:center;gap:10px;font-size:14px}#chBanner[hidden]{display:none}#chBanner span{flex:1}
#chBanner button{border:0;border-radius:14px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;color:#0b0a26;background:linear-gradient(120deg,#8ff,#f9d)}
#ring{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 8px);z-index:40;padding:14px;border-radius:26px;display:flex;align-items:center;gap:12px;transform:translateY(-140%);transition:transform .4s var(--ease)}#ring.on{transform:none}#ring span{flex:1;font-size:15px}
#ring button{border:0;border-radius:16px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}#ring .y{background:#46dc82;color:#04210f}#ring .n{background:rgba(255,255,255,.15);color:#fff}
.sheet{position:fixed;inset:0;z-index:35;display:flex;align-items:flex-end;background:rgba(0,0,0,.5)}.sheet>div{width:100%;max-height:70vh;overflow:auto;padding:18px 16px calc(var(--sab) + 18px);border-radius:28px 28px 0 0;background:rgba(18,16,54,.96);border:1px solid var(--glass-line)}
.sheet h3{margin:0 0 12px;font-size:17px}.sheet .in{margin-bottom:10px}
</style>
</head>
<body>

<div id="splash">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 12c0-4 3-7 8-7s8 3 8 7-3 7-8 7c-1 0-2-.1-3-.4L4 20l1-3.6C4.4 15.2 4 13.7 4 12z"/><path d="M9 11h6M9 14h4"/></svg></div>
  <div class="brand">ЭХО</div>
  <div class="sub">мессенджер СЛОВОПАДА</div>
  <div class="bar"><i></i></div>
</div>

<!-- вход -->
<div id="app" class="hid">
  <main id="authWrap" class="hid" style="display:flex;flex-direction:column">
    <div id="auth">
      <h2>Вход в ЭХО</h2>
      <p>Используй тот же ник и пароль, что в игре СЛОВОПАД. Друзья, комнаты и сообщения будут общими.</p>
      <div class="seg"><button id="tLogin" class="on" type="button">Войти</button><button id="tReg" type="button">Создать</button></div>
      <input class="in" id="nick" placeholder="Ник (3–20 символов)" autocomplete="username" maxlength="20">
      <input class="in" id="pass" type="password" placeholder="Пароль (от 8 символов)" autocomplete="current-password">
      <button class="btn" id="go" type="button">ВОЙТИ</button>
      <div class="hint" id="authHint"></div>
      <button class="btn ghost" id="qrOpen" type="button">📷 ВОЙТИ ПО QR ИЗ ИГРЫ</button>
      <div id="qrBox" class="qrbox hid">
        <p class="qrh">Открой игру на телефоне, где ты уже вошёл: Профиль → Slovopad ID → «Сканировать QR». Или наведи камеру телефона на код.</p>
        <canvas id="qrCv" width="240" height="240"></canvas>
        <div class="qrc" id="qrCode"></div>
        <div class="hint" id="qrPin"></div>
        <div class="hint" id="qrHint"></div>
        <button class="btn ghost hid" id="qrNew" type="button">НОВЫЙ КОД</button>
        <button class="btn ghost" id="qrCancel" type="button" style="margin-top:8px">ОТМЕНА</button>
      </div>
    </div>
  </main>

  <div id="home" class="hid" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header>
      <h1>ЭХО</h1>
      <button class="ibtn" id="refresh" type="button" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg></button>
    </header>
    <main id="content"></main>
    <nav class="glass">
      <span class="pill"></span>
      <button data-tab="chats" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M21 12c0 4-4 7-9 7-1.2 0-2.3-.2-3.3-.5L4 20l1.3-3.9C4.5 15 4 13.6 4 12c0-4 4-7 9-7s8 3 8 7z"/></svg>Чаты</button>
      <button data-tab="rooms" type="button"><svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></svg>Комнаты</button>
      <button data-tab="friends" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.6 3.4 5.2"/></svg>Друзья</button>
    </nav>
  </div>
</div>

<!-- чат с человеком -->
<section id="chat" aria-label="Чат">
  <header>
    <button class="ibtn" id="chBack" type="button" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="av" id="chAv" style="width:38px;height:38px;font-size:15px"></div>
    <div class="grow"><b id="chName"></b><small id="chSub"></small></div>
    <button class="ibtn chbtn" id="chInv" type="button" aria-label="Пригласить" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M18 8v6M15 11h6"/></svg></button>
    <button class="ibtn chbtn" id="chCall" type="button" aria-label="Позвонить"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
  </header>
  <div id="chBanner" class="glass" hidden></div>
  <div id="msgs"></div>
  <div class="composer glass"><input id="chIn" placeholder="Сообщение" maxlength="500" enterkeyhint="send"><button id="chSend" type="button" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button></div>
</section>

<div class="toast glass" id="toast"></div>
<div id="ring" class="glass"><span id="ringT"></span><button class="n" id="ringNo" type="button">Позже</button><button class="y" id="ringYes" type="button">Ответить</button></div>

<script src="qr.js"></script>
<script src="call.js"></script>
<script>
(() => {
  "use strict";
  // Тот же сервер, что у игры: аккаунт, друзья и сообщения общие.
  const API = "https://slovopad-api.stasikyarosh2000.workers.dev";
  const GAME = "https://felykxzy.github.io/slovopad.game/";
  const TOKEN = "echoToken";
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let token = null; try { token = localStorage.getItem(TOKEN) } catch (e) {}
  let me = null, tab = "chats", chat = null, room = null, timer = null, last = 0, busy = false;

  const toast = (t) => { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200) };

  async function api(path, body) {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000);
    let r;
    try {
      r = await fetch(API + path, { method: body === undefined ? "GET" : "POST", headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) }, body: body === undefined ? undefined : JSON.stringify(body), signal: ctl.signal });
    } catch (e) { throw new Error("Нет связи с сервером. Проверь интернет.") } finally { clearTimeout(tm) }
    let d = {}; try { d = await r.json() } catch (e) {}
    if (r.status === 401 && token) { logout(true); throw new Error("Сессия истекла. Войди снова.") }
    if (!r.ok) throw new Error(d.error || ("Ошибка сервера: " + r.status));
    return d;
  }
  const av = (p, cls = "") => `<div class="av ${p && p.online ? "on" : ""} ${cls}">${esc((p && (p.avatar || (p.username || "?")[0])) || "?")}</div>`;
  const ico = {
    add: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12l4 4 10-10"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  /* ---------- заставка и вход ---------- */
  setTimeout(boot, 1100);
  function boot() {
    $("splash").classList.add("done");
    if (token) { $("app").classList.remove("hid"); $("home").classList.remove("hid"); loadMe(); }
    else { $("app").classList.remove("hid"); $("authWrap").classList.remove("hid"); }
  }
  let mode = "login";
  const setMode = m => { mode = m; $("tLogin").classList.toggle("on", m === "login"); $("tReg").classList.toggle("on", m === "reg"); $("go").textContent = m === "login" ? "ВОЙТИ" : "СОЗДАТЬ АККАУНТ"; $("authHint").textContent = "" };
  $("tLogin").onclick = () => setMode("login"); $("tReg").onclick = () => setMode("reg");
  $("pass").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click() });
  $("go").onclick = async () => {
    if (busy) return;
    const username = $("nick").value.trim(), password = $("pass").value;
    if (username.length < 3 || password.length < 8) { $("authHint").textContent = "Ник от 3 символов, пароль от 8."; $("authHint").classList.add("bad"); return }
    busy = true; $("go").disabled = true; $("authHint").classList.remove("bad"); $("authHint").textContent = "Подключаюсь…";
    try {
      const d = await api(mode === "login" ? "/api/login" : "/api/register", { username, password });
      token = d.token; localStorage.setItem(TOKEN, token);
      $("pass").value = ""; $("authWrap").classList.add("hid"); $("home").classList.remove("hid"); me = d; render();
    } catch (e) { $("authHint").textContent = e.message; $("authHint").classList.add("bad") }
    finally { busy = false; $("go").disabled = false }
  };
  async function loadMe() { try { me = await api("/api/me") } catch (e) { return } render() }
  function logout(silent) {
    token = null; me = null; try { localStorage.removeItem(TOKEN) } catch (e) {}
    closeChat(); stopPoll(); $("home").classList.add("hid"); $("authWrap").classList.remove("hid");
    if (!silent) toast("Ты вышел из аккаунта");
  }

  /* ---------- вход по QR из игры ---------- */
  let qr = null, qrTimer = 0;
  function qrStop() {
    clearInterval(qrTimer); qrTimer = 0; qr = null;
    $("qrBox").classList.add("hid"); $("qrOpen").classList.remove("hid");
  }
  async function qrStart() {
    qrStop();
    $("qrBox").classList.remove("hid"); $("qrOpen").classList.add("hid"); $("qrNew").classList.add("hid");
    $("qrPin").textContent = ""; $("qrCode").textContent = ""; $("qrHint").classList.remove("bad"); $("qrHint").textContent = "Создаю код…";
    let d;
    try { d = await api("/api/qr/new", {}) } catch (e) { qrStop(); $("authHint").textContent = e.message; $("authHint").classList.add("bad"); return }
    const s = qr = { code: d.code, secret: d.secret, end: Date.now() + d.expiresIn * 1000 };
    try { SlovopadQR.draw($("qrCv"), GAME + "?qr=" + d.code, 240) } catch (e) { qrStop(); $("authHint").textContent = "Не удалось нарисовать код."; return }
    $("qrCode").textContent = d.code.slice(0, 4) + "-" + d.code.slice(4);
    $("qrPin").textContent = "Число для телефона: " + d.pin;
    $("qrHint").textContent = "Жду подтверждения из игры…"; $("qrBox").scrollIntoView({ behavior: "smooth", block: "center" });
    qrTimer = setInterval(async () => {
      if (qr !== s) return;
      if (Date.now() >= s.end) {
        clearInterval(qrTimer); qr = null;
        $("qrHint").textContent = "Код устарел. Создай новый."; $("qrHint").classList.add("bad"); $("qrNew").classList.remove("hid"); return;
      }
      const left = Math.max(0, Math.ceil((s.end - Date.now()) / 1000));
      $("qrHint").textContent = "Жду подтверждения из игры… Действует ещё " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
      let r; try { r = await api("/api/qr/poll", { code: s.code, secret: s.secret }) } catch (e) { return }
      if (qr !== s) return;
      if (r.status === "ok") {
        clearInterval(qrTimer); qr = null;
        token = r.token; localStorage.setItem(TOKEN, token);
        me = r; $("qrBox").classList.add("hid"); $("authWrap").classList.add("hid"); $("home").classList.remove("hid"); render(); toast("Вход выполнен");
      } else if (r.status === "expired") {
        clearInterval(qrTimer); qr = null;
        $("qrHint").textContent = "Код устарел. Создай новый."; $("qrHint").classList.add("bad"); $("qrNew").classList.remove("hid");
      }
    }, 2000);
  }
  $("qrOpen").onclick = qrStart;
  $("qrNew").onclick = qrStart;
  $("qrCancel").onclick = qrStop;

  /* ---------- главная ---------- */
  document.querySelectorAll("nav button").forEach((b, i) => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b)); document.querySelector("nav .pill").style.transform = "translateX(" + (i * 100) + "%)"; render() });
  $("refresh").onclick = () => render();

  const promo = () => `<a class="promo" href="${GAME}" target="_blank" rel="noopener">
      <div class="ic">🎮</div>
      <div><b>СЛОВОПАД</b><span>Скорость печати и рекорды друзей</span></div>
      <div class="go">ИГРАТЬ</div></a>`;

  async function render() {
    if (!token) return;
    const c = $("content");
    if (tab === "chats") {
      const d = await api("/api/friends").catch(e => ({ err: e.message }));
      if (d.err) return c.innerHTML = promo() + `<div class="empty">${esc(d.err)}</div>`;
      const fr = d.friends || [];
      c.innerHTML = promo() + (fr.length ? `<div class="sec">ЛИЧНЫЕ ЧАТЫ</div>` + fr.map(p => `<div class="row" data-chat="${esc(p.spCode)}">${av(p)}<div class="grow"><b>${esc(p.username)}</b><small>${p.online ? "в сети" : "не в сети"}</small></div>${p.unread ? `<span class="badge">${p.unread}</span>` : ""}</div>`).join("")
        : `<div class="empty">Пока нет друзей. Добавь их во вкладке «Друзья», и здесь появятся чаты.</div>`);
      c.querySelectorAll("[data-chat]").forEach(el => el.onclick = () => openChat(fr.find(p => p.spCode === el.dataset.chat)));
    }
    if (tab === "rooms") {
      const d = await api("/api/echo/rooms").catch(e => ({ err: e.message }));
      if (d.err) return c.innerHTML = promo() + `<div class="empty">${esc(d.err)}</div>`;
      const rs = (d.rooms || []).filter(r => !isDm(r.name)); dmRooms = (d.rooms || []).filter(r => isDm(r.name));
      c.innerHTML = promo() + `<button class="btn" id="rmNew" type="button">＋ СОЗДАТЬ КОМНАТУ</button>` + (rs.length ? `<div class="sec">КОМНАТЫ</div>` + rs.map(r => `<div class="row rm" data-room="${esc(r.id)}" data-name="${esc(r.name)}"><div class="av">${esc((r.name || "#")[0])}</div><div class="grow"><b>${esc(r.name)}</b><small>${esc(r.last || (r.members + " участн."))}</small></div>${r.unread ? `<span class="badge">${r.unread}</span>` : ""}</div>`).join("")
        : `<div class="empty">Комнат пока нет. Создай свою или попроси друга пригласить тебя.</div>`);
      c.querySelectorAll("[data-room]").forEach(el => el.onclick = () => openRoom(el.dataset.room, el.dataset.name));
      $("rmNew").onclick = newRoom;
    }
    if (tab === "friends") {
      const d = await api("/api/friends").catch(e => ({ err: e.message }));
      if (d.err) return c.innerHTML = `<div class="empty">${esc(d.err)}</div>`;
      c.innerHTML = `<div class="sec">ДОБАВИТЬ ДРУГА</div>
        <div style="display:flex;gap:8px;margin-bottom:6px"><input class="in" id="fq" placeholder="Ник или код SP-…" style="margin:0"><button class="btn" id="fadd" style="width:auto;padding:0 16px" type="button" aria-label="Добавить">${ico.add}</button></div>
        <div class="hint" id="fh"></div>
        ${(d.incoming || []).length ? `<div class="sec">ЗАПРОСЫ</div>` + d.incoming.map(p => `<div class="row">${av(p)}<div class="grow"><b>${esc(p.username)}</b><small>${esc(p.spCode)}</small></div><button class="ibtn" data-yes="${esc(p.spCode)}" aria-label="Принять">${ico.check}</button>&nbsp;<button class="ibtn" data-no="${esc(p.spCode)}" aria-label="Отклонить">${ico.x}</button></div>`).join("") : ""}
        <div class="sec">ДРУЗЬЯ · ${(d.friends || []).length}</div>
        ${(d.friends || []).length ? d.friends.map(p => `<div class="row">${av(p)}<div class="grow"><b>${esc(p.username)}</b><small>${esc(p.spCode)}</small></div><button class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px" data-chat="${esc(p.spCode)}">Написать</button></div>`).join("") : `<div class="empty">Друзей пока нет.</div>`}`;
      const fh = (t, bad) => { $("fh").textContent = t; $("fh").classList.toggle("bad", !!bad) };
      $("fadd").onclick = async () => {
        const q = $("fq").value.trim(); if (!q) return fh("Введи ник или код.", true);
        try { const r = await api("/api/friends/request", { q }); $("fq").value = ""; fh(r.state === "accepted" ? "Теперь вы друзья ✓" : "Запрос отправлен."); render() }
        catch (e) { fh(e.message, true) }
      };
      c.querySelectorAll("[data-yes]").forEach(b => b.onclick = async () => { await api("/api/friends/respond", { code: b.dataset.yes, accept: true }).catch(e => toast(e.message)); render() });
      c.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => { await api("/api/friends/respond", { code: b.dataset.no, accept: false }).catch(e => toast(e.message)); render() });
      c.querySelectorAll("[data-chat]").forEach(b => b.onclick = () => openChat((d.friends || []).find(p => p.spCode === b.dataset.chat)));
    }
  }

  /* ---------- личный чат ---------- */
  function openChat(p) {
    if (!p) return;
    closeChat(false); chat = p; room = null; last = 0; $("chat").classList.add("canc"); $("chInv").hidden = true; banner(null);
    $("chName").textContent = p.username; $("chSub").textContent = p.online ? "в сети" : "не в сети";
    $("chAv").className = "av " + (p.online ? "on" : ""); $("chAv").textContent = (p.avatar || p.username[0]).toString();
    $("msgs").innerHTML = ""; $("chat").classList.add("open");
    pollChat(); timer = setInterval(pollChat, 3000);
  }
  async function pollChat() {
    if (!chat) return;
    const who = chat;
    try {
      const r = await api("/api/chat?with=" + encodeURIComponent(who.spCode) + "&after=" + last);
      if (chat !== who) return;
      const box = $("msgs"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || !last;
      (r.messages || []).forEach(m => { if (m.id <= last) return; last = m.id; box.insertAdjacentHTML("beforeend", `<div class="msg ${m.mine ? "me" : ""}">${esc(m.body)}<span class="t">${clock(m.t)}</span></div>`) });
      if (stick) box.scrollTop = box.scrollHeight;
    } catch (e) {}
  }
  async function sendChat() {
    const t = $("chIn").value.trim(); if (!t) return;
    if (room) {
      const cur = room; $("chIn").value = "";
      try { await api("/api/echo/room/send", { room: cur.id, text: t }); pollRoom() } catch (e) { toast(e.message) }
      return;
    }
    if (!chat) return;
    const who = chat; $("chIn").value = "";
    try { await api("/api/chat/send", { to: who.spCode, text: t }); pollChat() } catch (e) { toast(e.message) }
  }
  function closeChat(hide = true) {
    clearInterval(timer); timer = null;
    if (hide) $("chat").classList.remove("open");
    $("chat").classList.remove("canc"); banner(null);
    chat = null; if (hide) room = null;
  }
  $("chBack").onclick = () => { closeChat(); render() };
  $("chSend").onclick = sendChat;
  $("chIn").addEventListener("keydown", e => { if (e.key === "Enter") sendChat() });

  /* ---------- комната ---------- */
  function openRoom(id, name) {
    closeChat(false); room = { id, name }; last = 0; $("chat").classList.add("canc"); $("chInv").hidden = false; banner(null); pollBanner();
    $("chName").textContent = "# " + name; $("chSub").textContent = "комната";
    $("chAv").className = "av rm"; $("chAv").textContent = (name || "#")[0];
    $("msgs").innerHTML = ""; $("chat").classList.add("open");
    pollRoom(); timer = setInterval(pollRoom, 3000);
  }
  async function pollRoom() {
    if (!room) return;
    const cur = room;
    try {
      const r = await api("/api/echo/room/msgs?room=" + encodeURIComponent(cur.id) + "&after=" + last);
      if (room !== cur) return;
      const box = $("msgs"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80 || !last;
      (r.messages || []).forEach(m => { if (m.id <= last) return; last = m.id; box.insertAdjacentHTML("beforeend", `<div class="msg ${m.mine ? "me" : ""}">${m.mine ? "" : `<span class="who">${esc(m.who)}</span>`}${esc(m.body)}<span class="t">${clock(m.t)}</span></div>`) });
      if (stick) box.scrollTop = box.scrollHeight;
    } catch (e) {}
  }
  function stopPoll() { clearInterval(timer); timer = null }
  const clock = t => { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") };

  /* ---------- звонки, комнаты ---------- */
  const isDm = n => String(n || "").startsWith("Зв:");
  let dmRooms = [], dismissed = {}, ringRoom = null, rr = 0;
  const dmName = p => "Зв:" + [me && me.username || "", p.username].sort().join("+").slice(0, 21);
  const sheetOpen = html => { const d = document.createElement("div"); d.className = "sheet"; d.innerHTML = "<div>" + html + "</div>"; d.onclick = e => { if (e.target === d) d.remove() }; document.body.appendChild(d); return d };
  EchoCall.init({ api: (p, b) => api(p, b === undefined ? undefined : b) });
  EchoCall.onEnd = t => toast(t);
  EchoCall.onChange = () => { pollBanner() };

  async function newRoom() {
    const d = sheetOpen('<h3>Новая комната</h3><input class="in" id="nrN" maxlength="24" placeholder="Название"><button class="btn" id="nrGo" type="button">СОЗДАТЬ</button>');
    $("nrGo").onclick = async () => {
      const name = $("nrN").value.trim(); if (!name) return;
      try { const r = await api("/api/echo/room", { name }); d.remove(); toast("Комната создана"); await render(); openRoom(r.id, r.name || name) } catch (e) { toast(e.message) }
    };
  }
  async function invite() {
    if (!room) return;
    let d; try { d = await api("/api/friends") } catch (e) { return toast(e.message) }
    const fr = d.friends || [];
    const sh = sheetOpen("<h3>Пригласить друга</h3>" + (fr.length ? fr.map(p => `<div class="row" data-inv="${esc(p.spCode)}">${av(p)}<div class="grow"><b>${esc(p.username)}</b></div></div>`).join("") : '<div class="empty">Сначала добавь друзей.</div>'));
    sh.querySelectorAll("[data-inv]").forEach(el => el.onclick = async () => {
      try { await api("/api/echo/room/invite", { room: room.id, code: el.dataset.inv }); toast("Приглашение отправлено ✓"); sh.remove() } catch (e) { toast(e.message) }
    });
  }
  $("chInv").onclick = invite;
  $("chCall").onclick = async () => {
    if (room) return EchoCall.join(room.id, room.name);
    if (!chat) return;
    const p = chat, nm = dmName(p);
    try {
      let r = dmRooms.find(x => x.name === nm);
      if (!r) { const l = await api("/api/echo/rooms"); dmRooms = (l.rooms || []).filter(x => isDm(x.name)); r = dmRooms.find(x => x.name === nm) }
      if (!r) { const c = await api("/api/echo/room", { name: nm }); r = { id: c.id, name: nm }; dmRooms.push(r) }
      try { await api("/api/echo/room/invite", { room: r.id, code: p.spCode }) } catch (e) { if (!/уже в комнате/.test(e.message)) throw e }
      EchoCall.join(r.id, p.username);
    } catch (e) { toast(e.message) }
  };

  function banner(parts, id, name) {
    const b = $("chBanner"); b.hidden = true; b.textContent = "";
    if (!parts) return;
    if (EchoCall.active() && EchoCall.room() === id) {
      b.innerHTML = "<span>Ты в звонке</span>"; const o = document.createElement("button"); o.textContent = "ОТКРЫТЬ"; o.onclick = () => EchoCall.show(); b.appendChild(o); b.hidden = false;
    } else if (parts.length) {
      b.innerHTML = "<span>В звонке: " + esc(parts.join(", ")) + "</span>"; const o = document.createElement("button"); o.textContent = "ВОЙТИ"; o.onclick = () => EchoCall.join(id, name); b.appendChild(o); b.hidden = false;
    }
  }
  async function pollBanner() {
    if (!token || !room) return;
    const cur = room, parts = await EchoCall.who(cur.id);
    if (room === cur) banner(parts, cur.id, cur.name);
  }
  setInterval(pollBanner, 12000);

  // входящий звонок от друга: смотрим личные комнаты «Зв:…»
  async function ringTick() {
    if (!token || !me || EchoCall.active() || document.hidden) return;
    if (++rr % 6 === 1) { try { const l = await api("/api/echo/rooms"); dmRooms = (l.rooms || []).filter(x => isDm(x.name)) } catch (e) { return } }
    if (!dmRooms.length) return;
    const r = dmRooms[rr % dmRooms.length], parts = await EchoCall.who(r.id), others = parts.filter(n => n !== me.username);
    if (!others.length) { delete dismissed[r.id]; if (ringRoom === r.id) $("ring").classList.remove("on"); return }
    if (dismissed[r.id] || (chat && dmName(chat) === r.name)) return;
    ringRoom = r.id; $("ringT").textContent = "📞 " + others.join(", ") + " звонит…"; $("ring").classList.add("on"); EchoCall.sfx("ring");
    $("ringYes").onclick = () => { $("ring").classList.remove("on"); const who = others[0]; EchoCall.join(r.id, who) };
    $("ringNo").onclick = () => { dismissed[r.id] = 1; $("ring").classList.remove("on") };
  }
  setInterval(ringTick, 10000);

  if (token) loadMe();
})();
</script>
</body>
</html>
